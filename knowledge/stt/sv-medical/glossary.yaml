# Swedish clinical vocabulary used two ways:
#  1. as the Whisper `prompt` (spelling bias: the recogniser sees these words
#     as if they had just been spoken, so it prefers these spellings), and
#  2. as the reference list for the LLM correction pass.
# `aliases` are misrecognitions the correction pass may map back to the term.
# The loop appends terms it learns from benchmark errors to glossary.learned.yaml.
name: sv-medical
version: 1
language: sv
context: "Samtal mellan patient och vårdpersonal på svenska. Patienten beskriver symtom, sjukdomshistoria och läkemedel."
